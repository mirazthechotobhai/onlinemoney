    <script>
      (function() {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : null;
          var proto = Object.getPrototypeOf(window);
          if (proto) {
            try {
              Object.defineProperty(proto, 'fetch', {
                get: function() { return currentFetch; },
                set: function(v) { currentFetch = v; },
                configurable: true,
                enumerable: true
              });
            } catch (e) {}
          }
          try {
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(v) { currentFetch = v; },
              configurable: true,
              enumerable: true
            });
          } catch (e) {}
        } catch (err) {}
      })();
    </script>
